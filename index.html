<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Measure your clicks per second, see your pace, and try to beat your personal best.">
  <meta name="theme-color" content="#f7f8fa">
  <title>CPS Tester</title>
  <link rel="stylesheet" href="./index.css">
  <script type="module" src="./index.js"></script>
</head>
<body>
  <main>
    <header class="header">
      <h1>CPS Tester</h1>
      <a href="https://github.com/egalgorix/Cps-tester">Source on GitHub</a>
    </header>

    <section aria-label="Click speed test">
      <fieldset class="duration">
        <legend>Test duration</legend>
        <div class="duration-options">
          <label><input type="radio" name="duration" value="1"><span>1s</span></label>
          <label><input type="radio" name="duration" value="5" checked><span>5s</span></label>
          <label><input type="radio" name="duration" value="10"><span>10s</span></label>
          <label><input type="radio" name="duration" value="15"><span>15s</span></label>
          <label><input type="radio" name="duration" value="30"><span>30s</span></label>
          <label><input type="radio" name="duration" value="60"><span>60s</span></label>
        </div>
      </fieldset>

      <dl class="scoreboard">
        <div><dt>Time left</dt><dd><span id="time">5.0</span><small> s</small></dd></div>
        <div><dt>Clicks</dt><dd id="clicks">0</dd></div>
        <div><dt>Clicks/sec</dt><dd id="cps">0.00</dd></div>
        <div><dt>Best <span id="best-duration">(5s)</span></dt><dd id="best">—</dd></div>
      </dl>

      <div class="target-wrap">
        <button type="button" id="target" aria-describedby="input-help">
          <span id="target-label">Start clicking</span>
          <span id="target-note">Your first click starts the timer</span>
        </button>
        <progress id="progress" max="1" value="0" aria-label="Round progress"></progress>
      </div>

      <div class="test-footer">
        <p id="input-help">Click, tap, or focus the target and press Space or Enter.</p>
        <button type="button" id="reset" disabled>Reset</button>
      </div>
    </section>

    <p class="sr-only" id="announcement" role="status" aria-atomic="true"></p>

    <section class="details" aria-label="Test results">
      <div>
        <h2>Click pace</h2>
        <p class="detail-note" id="pace-note">Finish a round to see your pace.</p>
        <ol id="pace" class="pace" hidden aria-label="Clicks by interval"></ol>
      </div>
      <div>
        <h2>Recent rounds <span id="history-duration">5s</span></h2>
        <p class="detail-note" id="history-empty">No rounds at this duration yet.</p>
        <ol class="history" id="history" hidden></ol>
      </div>
    </section>

    <noscript><p>JavaScript is required to run the click speed test.</p></noscript>
  </main>
</body>
</html>
